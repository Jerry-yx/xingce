<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申论归纳积累 · 交互系统</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", Roboto, system-ui, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.20);
      padding: 28px 32px 36px;
      border: 1px solid #e2e8f0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 3px solid #1a2b4c;
      padding-bottom: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0b1a33;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 small {
      font-size: 16px;
      font-weight: 400;
      color: #4a5b79;
      background: #eef2f8;
      padding: 2px 14px;
      border-radius: 30px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      background: transparent;
      border: 1px solid #b8cbe5;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 13px;
      color: #1f3b62;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }

    .btn:hover {
      background: #e6edf8;
    }

    .btn-primary {
      background: #1a2b4c;
      border-color: #1a2b4c;
      color: white;
    }

    .btn-primary:hover {
      background: #0f1f38;
    }

    .btn-success {
      background: #1f7840;
      border-color: #1f7840;
      color: white;
    }

    .btn-success:hover {
      background: #155d32;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }

    .tabs button {
      background: transparent;
      border: none;
      padding: 8px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #4a5b79;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tabs button:hover {
      background: #eef2f8;
    }

    .tabs button.active {
      background: #1a2b4c;
      color: white;
    }

    .tab-pane {
      display: none;
      animation: fade 0.2s;
    }

    .tab-pane.active {
      display: block;
    }

    @keyframes fade {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 1;
      }
    }

    /* 类别选择器 */
    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .category-bar .cat-btn {
      background: #f1f5f9;
      border: 2px solid transparent;
      padding: 6px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      color: #2d4a6a;
      cursor: pointer;
      transition: 0.2s;
    }

    .category-bar .cat-btn:hover {
      background: #e2eaf3;
    }

    .category-bar .cat-btn.active {
      border-color: #1a2b4c;
      background: #1a2b4c;
      color: white;
    }

    .form-section {
      background: #f8faff;
      border-radius: 20px;
      padding: 20px 24px 24px;
      border: 1px solid #dce6f2;
      margin-bottom: 28px;
    }

    .form-section h3 {
      font-size: 17px;
      color: #122a4a;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
    }

    .form-grid .full {
      grid-column: 1 / -1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-weight: 600;
      font-size: 13px;
      color: #1f3b62;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid #cbd8ec;
      background: white;
      font-size: 14px;
      font-family: inherit;
      transition: 0.15s;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #2f4b7a;
      box-shadow: 0 0 0 3px rgba(47, 75, 122, 0.12);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    /* 条目列表 */
    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .entry-card {
      background: #fafcff;
      border-radius: 14px;
      padding: 14px 18px;
      border: 1px solid #e2eaf2;
      border-left: 6px solid #7a95bd;
      transition: 0.1s;
    }

    .entry-card .e-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 16px;
      margin-bottom: 4px;
    }

    .entry-card .e-type {
      background: #dce5f0;
      padding: 0 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #1f3b62;
    }

    .entry-card .e-title {
      font-weight: 700;
      font-size: 16px;
      color: #0a1e38;
    }

    .entry-card .e-meta {
      font-size: 12px;
      color: #5b7397;
      margin-left: auto;
      display: flex;
      gap: 12px;
    }

    .entry-card .e-content {
      font-size: 14px;
      color: #1e334f;
      margin: 6px 0 4px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .entry-card .e-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-top: 4px;
    }

    .entry-card .e-tags .tag {
      background: #e8eff8;
      padding: 0 10px;
      border-radius: 20px;
      font-size: 12px;
      color: #1f4465;
    }

    .entry-card .e-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .entry-card .e-actions button {
      background: transparent;
      border: none;
      color: #4a6a8a;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .entry-card .e-actions button:hover {
      color: #b22234;
    }

    .empty-tip {
      color: #7a8aa8;
      text-align: center;
      padding: 30px 0;
      font-size: 15px;
    }

    /* 汇总视图 */
    .summary-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
      align-items: center;
    }

    .summary-controls .pill {
      background: #e6edf8;
      padding: 2px 16px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      color: #1a3760;
      cursor: pointer;
      transition: 0.1s;
      border: 2px solid transparent;
    }

    .summary-controls .pill.active {
      border-color: #1a2b4c;
      background: #1a2b4c;
      color: white;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .summary-card {
      background: #f8faff;
      border-radius: 16px;
      padding: 16px 20px;
      border: 1px solid #dce6f2;
    }

    .summary-card h4 {
      font-size: 15px;
      color: #122a4a;
      border-bottom: 2px solid #d7e2f0;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .summary-card .s-item {
      padding: 4px 0;
      font-size: 14px;
      border-bottom: 1px dotted #e2e8f0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .summary-card .s-item .scat {
      color: #4a5b79;
      font-weight: 500;
      min-width: 70px;
    }

    .summary-card .s-item .scontent {
      color: #0a1e38;
    }

    /* 响应式 */
    @media (max-width: 780px) {
      .container {
        padding: 16px 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-grid .full {
        grid-column: 1;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 22px;
      }

      .entry-card .e-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .entry-card .e-meta {
        margin-left: 0;
      }
    }

    .highlight {
      background: #f0f7ff;
      border-left-color: #2f4b7a;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container" id="app">
    <!-- 头部 -->
    <div class="header">
      <h1>📚 申论归纳积累 <small>按类别 · 要素维度</small></h1>
      <div class="toolbar">
        <button class="btn" onclick="exportAllData()">📤 导出数据</button>
        <button class="btn" onclick="importData()">📥 导入数据</button>
        <button class="btn btn-primary" onclick="clearAllData()">🗑️ 清空全部</button>
      </div>
    </div>

    <!-- 主标签 -->
    <div class="tabs">
      <button class="active" data-tab="tab-input">✏️ 录入</button>
      <button data-tab="tab-summary">📊 汇总视图</button>
    </div>

    <!-- ========================================================= -->
    <!-- TAB 录入 -->
    <!-- ========================================================= -->
    <div class="tab-pane active" id="tab-input">
      <!-- 类别切换 -->
      <div class="category-bar" id="categoryBar">
        <button class="cat-btn active" data-cat="政治">🏛️ 政治</button>
        <button class="cat-btn" data-cat="经济">💹 经济</button>
        <button class="cat-btn" data-cat="文化">📖 文化</button>
        <button class="cat-btn" data-cat="社会">👥 社会</button>
        <button class="cat-btn" data-cat="生态">🌿 生态</button>
      </div>

      <!-- 录入表单 -->
      <div class="form-section">
        <h3>📝 新增条目 · <span id="currentCategoryLabel">政治</span></h3>
        <div class="form-grid">
          <div class="form-group">
            <label>要素类型 *</label>
            <select id="entryType">
              <option value="问题">问题/现状</option>
              <option value="原因">原因</option>
              <option value="做法">做法/对策</option>
              <option value="影响">影响/意义</option>
              <option value="金句">金句/规范词</option>
              <option value="案例">案例</option>
            </select>
          </div>
          <div class="form-group">
            <label>标题/关键词 *</label>
            <input type="text" id="entryTitle" placeholder="例：基层治理数字化水平不足" />
          </div>
          <div class="form-group full">
            <label>具体内容 *</label>
            <textarea id="entryContent" rows="3" placeholder="详细描述……"></textarea>
          </div>
          <div class="form-group">
            <label>来源/出处</label>
            <input type="text" id="entrySource" placeholder="例：2024年政府工作报告" />
          </div>
          <div class="form-group">
            <label>适用话题 (标签，逗号分隔)</label>
            <input type="text" id="entryTags" placeholder="例：数字政府, 老龄化" />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-success" onclick="addEntry()">➕ 添加条目</button>
          <button class="btn" onclick="clearForm()">清空表单</button>
          <span style="margin-left:auto;font-size:13px;color:#4a5b79;" id="entryCount">当前类别: 0 条</span>
        </div>
      </div>

      <!-- 条目列表 -->
      <div style="margin-top:6px;">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
          <h3 style="color:#122a4a;">📋 条目列表 · <span id="listCategoryLabel">政治</span></h3>
          <div style="display:flex;gap:6px;">
            <button class="btn" onclick="filterType('all')" id="filterAll">全部</button>
            <button class="btn" onclick="filterType('问题')">问题</button>
            <button class="btn" onclick="filterType('做法')">做法</button>
            <button class="btn" onclick="filterType('金句')">金句</button>
          </div>
        </div>
        <div id="entryListContainer">
          <div class="empty-tip">暂无条目，添加第一条吧</div>
        </div>
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- TAB 汇总视图 -->
    <!-- ========================================================= -->
    <div class="tab-pane" id="tab-summary">
      <div class="summary-controls">
        <span style="font-weight:600;color:#1f3b62;">汇总方式：</span>
        <span class="pill active" data-summary="byCategory" onclick="switchSummaryView('byCategory')">按类别汇总</span>
        <span class="pill" data-summary="byType" onclick="switchSummaryView('byType')">按要素类型汇总</span>
        <span style="margin-left:auto;font-size:13px;color:#4a5b79;" id="summaryTotal">总计 0 条</span>
      </div>
      <div id="summaryContainer">
        <div class="empty-tip">暂无数据，请先录入条目</div>
      </div>
    </div>

    <!-- 隐藏的 file input -->
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)" />
  </div>

  <script>
    // ======================================================================
    // 数据层
    // ======================================================================
    const STORAGE_KEY = 'shenlun_accumulate_v1';

    // 默认数据结构: { category: [ entries ] }
    // 每个 entry: { id, type, title, content, source, tags, createdAt }

    function getDefaultData() {
      return {
        '政治': [],
        '经济': [],
        '文化': [],
        '社会': [],
        '生态': []
      };
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const data = JSON.parse(raw);
          // 确保所有类别存在
          const defaults = getDefaultData();
          for (let cat in defaults) {
            if (!data[cat]) data[cat] = [];
          }
          return data;
        } catch (e) {
          return getDefaultData();
        }
      }
      return getDefaultData();
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // 生成短id
    function genId() {
      return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    }

    // ======================================================================
    // 状态
    // ======================================================================
    let currentCategory = '政治';
    let currentFilter = 'all';
    let summaryView = 'byCategory'; // 'byCategory' | 'byType'

    // ======================================================================
    // DOM 引用
    // ======================================================================
    const categoryBar = document.getElementById('categoryBar');
    const currentCategoryLabel = document.getElementById('currentCategoryLabel');
    const listCategoryLabel = document.getElementById('listCategoryLabel');
    const entryListContainer = document.getElementById('entryListContainer');
    const entryCount = document.getElementById('entryCount');

    // 表单
    const entryType = document.getElementById('entryType');
    const entryTitle = document.getElementById('entryTitle');
    const entryContent = document.getElementById('entryContent');
    const entrySource = document.getElementById('entrySource');
    const entryTags = document.getElementById('entryTags');

    // 汇总
    const summaryContainer = document.getElementById('summaryContainer');
    const summaryTotal = document.getElementById('summaryTotal');

    // ======================================================================
    // 渲染：条目列表
    // ======================================================================
    function renderEntries() {
      const data = loadData();
      const entries = data[currentCategory] || [];
      const filtered = currentFilter === 'all' ? entries : entries.filter(e => e.type === currentFilter);

      if (filtered.length === 0) {
        entryListContainer.innerHTML = `<div class="empty-tip">暂无${currentFilter === 'all' ? '' : '“' + currentFilter + '”类'}条目</div>`;
      } else {
        let html = '<div class="entry-list">';
        filtered.forEach(function (entry) {
          const tags = entry.tags ? entry.tags.split(',').map(t => t.trim()).filter(t => t) : [];
          html += `
          <div class="entry-card">
            <div class="e-header">
              <span class="e-type">${entry.type}</span>
              <span class="e-title">${escapeHtml(entry.title)}</span>
              <span class="e-meta">
                <span>${entry.source ? '📎 ' + escapeHtml(entry.source) : ''}</span>
                <span>🕐 ${formatDate(entry.createdAt)}</span>
              </span>
            </div>
            <div class="e-content">${escapeHtml(entry.content)}</div>
            ${tags.length ? '<div class="e-tags">' + tags.map(t => '<span class="tag">#' + escapeHtml(t) + '</span>').join('') + '</div>' : ''}
            <div class="e-actions">
              <button onclick="deleteEntry('${entry.id}')">🗑️ 删除</button>
            </div>
          </div>
        `;
        });
        html += '</div>';
        entryListContainer.innerHTML = html;
      }
      entryCount.textContent = `当前类别: ${entries.length} 条`;
      listCategoryLabel.textContent = currentCategory;
      currentCategoryLabel.textContent = currentCategory;
    }

    // ======================================================================
    // 添加 / 删除 条目
    // ======================================================================
    function addEntry() {
      const type = entryType.value;
      const title = entryTitle.value.trim();
      const content = entryContent.value.trim();
      const source = entrySource.value.trim();
      const tags = entryTags.value.trim();

      if (!title || !content) {
        alert('请填写标题和具体内容');
        return;
      }

      const data = loadData();
      const newEntry = {
        id: genId(),
        type: type,
        title: title,
        content: content,
        source: source,
        tags: tags,
        createdAt: new Date().toISOString()
      };
      data[currentCategory].push(newEntry);
      saveData(data);
      renderEntries();
      clearForm();
      updateSummaryTotal();
      // 如果汇总视图可见，刷新
      if (document.getElementById('tab-summary').classList.contains('active')) {
        renderSummary();
      }
    }

    function deleteEntry(id) {
      if (!confirm('确定删除该条目吗？')) return;
      const data = loadData();
      data[currentCategory] = data[currentCategory].filter(e => e.id !== id);
      saveData(data);
      renderEntries();
      updateSummaryTotal();
      if (document.getElementById('tab-summary').classList.contains('active')) {
        renderSummary();
      }
    }

    function clearForm() {
      entryTitle.value = '';
      entryContent.value = '';
      entrySource.value = '';
      entryTags.value = '';
      entryType.value = '问题';
    }

    // ======================================================================
    // 筛选
    // ======================================================================
    function filterType(type) {
      currentFilter = type;
      document.querySelectorAll('#filterAll, .btn').forEach(function (btn) {
        if (btn.textContent === '全部' && type === 'all') btn.style.background = '#dce3ef';
        else if (btn.textContent === type) btn.style.background = '#dce3ef';
        else btn.style.background = 'transparent';
      });
      renderEntries();
    }

    // ======================================================================
    // 类别切换
    // ======================================================================
    function switchCategory(category) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.cat === category);
      });
      currentFilter = 'all';
      document.querySelectorAll('#filterAll, .btn').forEach(function (btn) {
        if (btn.textContent === '全部') btn.style.background = '#dce3ef';
        else btn.style.background = 'transparent';
      });
      renderEntries();
    }

    // ======================================================================
    // 汇总视图
    // ======================================================================
    function renderSummary() {
      const data = loadData();
      const allEntries = [];
      for (let cat in data) {
        data[cat].forEach(function (entry) {
          allEntries.push({ ...entry, category: cat });
        });
      }

      if (allEntries.length === 0) {
        summaryContainer.innerHTML = '<div class="empty-tip">暂无数据，请先录入条目</div>';
        summaryTotal.textContent = '总计 0 条';
        return;
      }

      summaryTotal.textContent = '总计 ' + allEntries.length + ' 条';

      let html = '';

      if (summaryView === 'byCategory') {
        // 按类别汇总
        const categories = ['政治', '经济', '文化', '社会', '生态'];
        html = '<div class="summary-grid">';
        categories.forEach(function (cat) {
          const items = data[cat] || [];
          if (items.length === 0) {
            html += `<div class="summary-card"><h4>${cat}</h4><div style="color:#7a8aa8;font-size:13px;">暂无条目</div></div>`;
            return;
          }
          // 按类型分组
          const groups = {};
          items.forEach(function (item) {
            if (!groups[item.type]) groups[item.type] = [];
            groups[item.type].push(item);
          });
          let cardHtml = `<div class="summary-card"><h4>${cat} (${items.length})</h4>`;
          const typeOrder = ['问题', '原因', '做法', '影响', '金句', '案例'];
          typeOrder.forEach(function (t) {
            if (groups[t] && groups[t].length) {
              cardHtml += `<div style="font-weight:600;font-size:13px;color:#2f4b7a;margin:6px 0 2px;">${t}</div>`;
              groups[t].forEach(function (item) {
                cardHtml +=
                  `<div class="s-item"><span class="scontent">• ${escapeHtml(item.title)}</span></div>`;
              });
            }
          });
          cardHtml += '</div>';
          html += cardHtml;
        });
        html += '</div>';
      } else {
        // 按要素类型汇总
        const typeOrder = ['问题', '原因', '做法', '影响', '金句', '案例'];
        html = '<div class="summary-grid">';
        typeOrder.forEach(function (type) {
          const items = allEntries.filter(e => e.type === type);
          if (items.length === 0) {
            html += `<div class="summary-card"><h4>${type}</h4><div style="color:#7a8aa8;font-size:13px;">暂无条目</div></div>`;
            return;
          }
          let cardHtml = `<div class="summary-card"><h4>${type} (${items.length})</h4>`;
          items.forEach(function (item) {
            cardHtml +=
              `<div class="s-item"><span class="scat">[${item.category}]</span><span class="scontent">${escapeHtml(item.title)}</span></div>`;
          });
          cardHtml += '</div>';
          html += cardHtml;
        });
        html += '</div>';
      }

      summaryContainer.innerHTML = html;
    }

    function switchSummaryView(view) {
      summaryView = view;
      document.querySelectorAll('.summary-controls .pill').forEach(function (p) {
        p.classList.toggle('active', p.dataset.summary === view);
      });
      renderSummary();
    }

    function updateSummaryTotal() {
      const data = loadData();
      let total = 0;
      for (let cat in data) total += data[cat].length;
      summaryTotal.textContent = '总计 ' + total + ' 条';
    }

    // ======================================================================
    // 导出 / 导入
    // ======================================================================
    function exportAllData() {
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '申论积累_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData() {
      document.getElementById('fileInput').click();
    }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const imported = JSON.parse(e.target.result);
          // 验证结构
          const keys = ['政治', '经济', '文化', '社会', '生态'];
          let valid = true;
          keys.forEach(function (k) {
            if (!Array.isArray(imported[k])) valid = false;
          });
          if (!valid) {
            alert('数据格式错误，请确保包含五大类别');
            return;
          }
          if (!confirm('将覆盖当前所有数据，确定吗？')) return;
          saveData(imported);
          renderEntries();
          renderSummary();
          updateSummaryTotal();
          alert('✅ 导入成功！');
        } catch (err) {
          alert('导入失败: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function clearAllData() {
      if (!confirm('确定清空所有数据吗？此操作不可撤销！')) return;
      saveData(getDefaultData());
      renderEntries();
      renderSummary();
      updateSummaryTotal();
    }

    // ======================================================================
    // 工具函数
    // ======================================================================
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    }

    // ======================================================================
    // Tab 切换
    // ======================================================================
    document.querySelectorAll('.tabs button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.remove('active'); });
        this.classList.add('active');
        const target = this.dataset.tab;
        document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('active'); });
        document.getElementById(target).classList.add('active');
        if (target === 'tab-summary') renderSummary();
        if (target === 'tab-input') renderEntries();
      });
    });

    // ======================================================================
    // 类别切换事件
    // ======================================================================
    categoryBar.addEventListener('click', function (e) {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      switchCategory(btn.dataset.cat);
    });

    // ======================================================================
    // 初始化
    // ======================================================================
    function init() {
      // 设置默认筛选高亮
      document.querySelector('#filterAll').style.background = '#dce3ef';
      renderEntries();
      updateSummaryTotal();
      // 如果汇总tab默认不可见，先不渲染
    }

    init();

    // 暴露全局函数给 onclick
    window.addEntry = addEntry;
    window.deleteEntry = deleteEntry;
    window.clearForm = clearForm;
    window.filterType = filterType;
    window.switchCategory = switchCategory;
    window.exportAllData = exportAllData;
    window.importData = importData;
    window.handleImport = handleImport;
    window.clearAllData = clearAllData;
    window.renderSummary = renderSummary;
    window.switchSummaryView = switchSummaryView;
    window.renderEntries = renderEntries;
    window.updateSummaryTotal = updateSummaryTotal;
  </script>

</body>

</html>
